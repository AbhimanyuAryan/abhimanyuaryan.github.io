<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Agentic automation map for invoicing and POS</title>
  <desc id="desc">A diagram showing where AI can automate setup, invoicing, stock, analytics, and compliance in a cloud commerce system.</desc>
  <rect width="1400" height="860" fill="#08111f"/>

  <text x="70" y="70" fill="#eff6ff" font-family="Arial, sans-serif" font-size="36" font-weight="700">Where AI Adds Leverage in Cloud Invoicing &amp; POS</text>
  <text x="70" y="108" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">AI should not replace the accounting core. It should sit on top of audited business tools.</text>

  <rect x="500" y="330" width="400" height="180" rx="24" ry="24" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <text x="605" y="390" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Agent Layer</text>
  <text x="580" y="428" fill="#eff6ff" font-family="Arial, sans-serif" font-size="20">Intent parsing</text>
  <text x="552" y="460" fill="#eff6ff" font-family="Arial, sans-serif" font-size="20">Recommendations &amp; automation</text>
  <text x="586" y="492" fill="#eff6ff" font-family="Arial, sans-serif" font-size="20">Natural language analytics</text>

  <line x1="500" y1="390" x2="400" y2="250" stroke="#60a5fa" stroke-width="3"/>
  <line x1="700" y1="330" x2="700" y2="240" stroke="#60a5fa" stroke-width="3"/>
  <line x1="900" y1="390" x2="980" y2="250" stroke="#60a5fa" stroke-width="3"/>
  <line x1="500" y1="450" x2="400" y2="650" stroke="#60a5fa" stroke-width="3"/>
  <line x1="700" y1="510" x2="700" y2="620" stroke="#60a5fa" stroke-width="3"/>
  <line x1="900" y1="450" x2="980" y2="650" stroke="#60a5fa" stroke-width="3"/>

  <rect x="120" y="160" width="280" height="120" rx="18" ry="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="184" y="205" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Catalog Setup</text>
  <text x="152" y="240" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Import SKUs, VAT, variants,</text>
  <text x="192" y="268" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">deduplicate products</text>

  <rect x="510" y="120" width="380" height="120" rx="18" ry="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="607" y="165" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Invoice Assistant</text>
  <text x="541" y="200" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Draft documents from plain language,</text>
  <text x="579" y="228" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">follow up on unpaid balances</text>

  <rect x="980" y="160" width="280" height="120" rx="18" ry="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="1031" y="205" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">POS Copilot</text>
  <text x="1022" y="240" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Smart search, bundles,</text>
  <text x="1024" y="268" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">modifier assistance</text>

  <rect x="120" y="590" width="280" height="120" rx="18" ry="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="181" y="635" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Inventory Agent</text>
  <text x="160" y="670" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Reorder suggestions, shrinkage,</text>
  <text x="192" y="698" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">store transfers</text>

  <rect x="510" y="620" width="380" height="120" rx="18" ry="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="601" y="665" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Analytics Agent</text>
  <text x="552" y="700" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Answer: what changed, what is low,</text>
  <text x="598" y="728" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">who underperformed</text>

  <rect x="980" y="590" width="280" height="120" rx="18" ry="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="1040" y="635" fill="#eff6ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Compliance Copilot</text>
  <text x="1017" y="670" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">Pre-issue checks, anomaly flags,</text>
  <text x="1053" y="698" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">accountant exports</text>
</svg>