<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Cloud invoicing and POS architecture</title>
  <desc id="desc">A layered diagram showing channels, application modules, compliance, and infrastructure for a cloud-based invoicing and POS platform.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8fb3ff"/>
    </marker>
  </defs>
  <rect width="1400" height="920" fill="#0b1020"/>
  <text x="70" y="70" fill="#e5eefc" font-family="Arial, sans-serif" font-size="36" font-weight="700">Cloud Invoicing + POS Product Architecture</text>
  <text x="70" y="108" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">A business operating system: documents, checkout, stock, compliance, devices, and APIs.</text>

  <rect x="60" y="150" width="1280" height="130" rx="18" ry="18" fill="#111831" stroke="#2b3a67" stroke-width="2"/>
  <text x="90" y="195" fill="#e5eefc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Channels &amp; Devices</text>
  <rect x="90" y="215" width="210" height="45" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="130" y="245" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Browser / Desktop</text>
  <rect x="320" y="215" width="210" height="45" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="388" y="245" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Tablet POS</text>
  <rect x="550" y="215" width="210" height="45" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="625" y="245" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Mobile</text>
  <rect x="780" y="215" width="220" height="45" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="822" y="245" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Printers / Scanners</text>
  <rect x="1020" y="215" width="280" height="45" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="1093" y="245" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Kitchen Screens / Cash Drawer</text>

  <rect x="60" y="320" width="1280" height="220" rx="18" ry="18" fill="#111831" stroke="#2b3a67" stroke-width="2"/>
  <text x="90" y="365" fill="#e5eefc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Application Layer</text>
  <rect x="90" y="390" width="250" height="60" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="138" y="427" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Invoicing &amp; Documents</text>
  <rect x="370" y="390" width="220" height="60" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="434" y="427" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Retail POS</text>
  <rect x="620" y="390" width="250" height="60" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="678" y="427" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Restaurant POS</text>
  <rect x="900" y="390" width="200" height="60" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="947" y="427" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Reporting</text>
  <rect x="1130" y="390" width="170" height="60" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="1171" y="427" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">API</text>

  <rect x="90" y="470" width="250" height="50" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="140" y="502" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">Quotes, invoices, credit notes</text>
  <rect x="370" y="470" width="220" height="50" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="401" y="502" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">Checkout, returns, vouchers</text>
  <rect x="620" y="470" width="250" height="50" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="661" y="502" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">Tables, modifiers, kitchen flow</text>
  <rect x="900" y="470" width="200" height="50" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="938" y="502" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">Sales, staff, stock</text>
  <rect x="1130" y="470" width="170" height="50" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="1154" y="502" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">Integrations</text>

  <rect x="60" y="580" width="1280" height="150" rx="18" ry="18" fill="#111831" stroke="#2b3a67" stroke-width="2"/>
  <text x="90" y="625" fill="#e5eefc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Core Business Services</text>
  <rect x="90" y="645" width="220" height="55" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="155" y="679" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Products</text>
  <rect x="330" y="645" width="220" height="55" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="393" y="679" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Customers</text>
  <rect x="570" y="645" width="220" height="55" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="629" y="679" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Inventory</text>
  <rect x="810" y="645" width="220" height="55" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="880" y="679" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Payments</text>
  <rect x="1050" y="645" width="250" height="55" rx="14" ry="14" fill="#172243" stroke="#3d4f83" stroke-width="2"/><text x="1114" y="679" fill="#e5eefc" font-family="Arial, sans-serif" font-size="20">Users &amp; Permissions</text>

  <rect x="60" y="770" width="1280" height="100" rx="18" ry="18" fill="#111831" stroke="#2b3a67" stroke-width="2"/>
  <text x="90" y="815" fill="#e5eefc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Compliance &amp; Infrastructure</text>
  <text x="360" y="815" fill="#b7c3e0" font-family="Arial, sans-serif" font-size="20">Series • Tax Rules • SAF-T • QR/ATCUD • Audit Logs • Multi-Tenant Database • Realtime Sync</text>

  <path d="M700 280 L700 320" stroke="#8fb3ff" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M700 540 L700 580" stroke="#8fb3ff" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M700 730 L700 770" stroke="#8fb3ff" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
</svg>